[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-modal"
dynamic = ["version"]
description = "Speech-to-text for LiveKit Agents on your own Modal GPUs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Mahimai Raja J", email = "mahimairaja3@gmail.com" }]
keywords = [
    "webrtc",
    "realtime",
    "audio",
    "livekit",
    "livekit-agents",
    "stt",
    "speech-to-text",
    "whisper",
    "modal",
    "gpu",
    "self-hosted",
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "livekit-agents==1.8.6",
    "modal==1.6.1",
    "numpy==2.5.4",
]

[project.urls]
Documentation = "https://modal.com/docs"
Source = "https://github.com/mahimairaja/livekit-plugins"

[tool.hatch.version]
path = "livekit/plugins/modal/version.py"

[tool.hatch.build.targets.wheel]
packages = ["livekit"]

[tool.hatch.build.targets.sdist]
include = ["/livekit"]
