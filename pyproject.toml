[project]
name = "livekit-plugins-workspace"
version = "0.1.0"
description = "Unmerged LiveKit Agents plugins, installable straight from GitHub"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
    "livekit-plugins-hf",
    "livekit-plugins-modal",
    "livekit-plugins-sherpa",
]

[dependency-groups]
dev = [
    # Types for the Modal server templates; the containers pin the same version.
    "fastapi==0.120.0",
    "jiwer==4.0.0",
    "mypy==2.4.0",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
]

[tool.uv]
package = false
required-version = ">=0.8.15"

[tool.uv.sources]
livekit-plugins-hf = { workspace = true }
livekit-plugins-modal = { workspace = true }
livekit-plugins-sherpa = { workspace = true }

[tool.uv.workspace]
members = ["livekit-plugins/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "RUF006", # asyncio-dangling-task
]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["livekit"]

[tool.mypy]
strict = true
disallow_any_generics = false
plugins = ["pydantic.mypy"]
explicit_package_bases = true
# One entry per plugin, so `livekit.plugins.<name>` resolves from each workspace member.
mypy_path = [
    "$MYPY_CONFIG_FILE_DIR/livekit-plugins/livekit-plugins-hf",
    "$MYPY_CONFIG_FILE_DIR/livekit-plugins/livekit-plugins-modal",
    "$MYPY_CONFIG_FILE_DIR/livekit-plugins/livekit-plugins-sherpa",
]
namespace_packages = true

# Compiled extension without stubs. The plugin types it through Protocols in stt.py.
[[tool.mypy.overrides]]
module = "sherpa_onnx.*"
ignore_missing_imports = true

# Imported only inside the Modal containers, never installed locally.
[[tool.mypy.overrides]]
module = ["faster_whisper.*", "nemo.*", "silero_vad.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--import-mode=importlib"]
markers = [
    "unit: fast tests with fakes, no model downloads",
    "plugin(name): real-model tests; download models once, skip when offline",
]
